name: CI
on: push

jobs:
  test:
    runs-on: self-hosted        # Option B mein: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Run tests
        id: tests
        continue-on-error: true
                run: python -m pytest --json-report --json-report-file=raw.json

      - name: Send report to localhost receiver
        if: always()
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: python send_report.py

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1