name: CI
on: push

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest --json-report --json-report-file=raw.json

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-results
          path: raw.json

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  report:
    needs: test
    if: always()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-results
      - name: Send report to localhost receiver
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: python send_report.py receiver

  email:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-results
      - name: Send report by email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_report.py email

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4